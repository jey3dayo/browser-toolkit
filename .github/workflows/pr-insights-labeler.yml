name: PR Insights Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Label PR with Insights
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply PR Insights Labels
        uses: jey3dayo/pr-insights-labeler@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          file_size_limit: '100KB'
          file_lines_limit: '500'
          pr_additions_limit: '5000'
          pr_files_limit: '50'

          # 除外は行数チェックだけでなく size / risk ラベルの算出にも効く。
          # 文言カタログ・token CSS・ドキュメントは変更規模に数えない方針で除外している。
          additional_exclude_patterns: |
            src/i18n/resources.ts
            src/styles/tokens/components/popup-misc.css
            docs/**
            plans/**
            **/*.generated.ts
            __snapshots__/**
            tests/e2e/fixtures/**
          language: 'ja'
