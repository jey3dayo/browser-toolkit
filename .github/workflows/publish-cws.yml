name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "疎通確認だけ行う（アップロード・提出しない）"
        type: boolean
        default: false
      skip_publish:
        description: "アップロードまでで止める（審査提出しない）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-cws
  cancel-in-progress: false

jobs:
  publish:
    name: "Upload and submit to Chrome Web Store"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node Environment
        uses: ./.github/actions/setup-node-env

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm package:cws

      - name: Publish
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_SA_KEY: ${{ secrets.CWS_SA_KEY }}
        run: |
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ "${{ inputs.skip_publish }}" = "true" ]; then args="$args --skip-publish"; fi
          pnpm publish:cws $args
