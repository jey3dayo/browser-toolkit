# lefthook が見つからないと生成 hook は既定で gate 無しに通すため、hard fail させる
assert_lefthook_installed: true

pre-commit:
  jobs:
    - name: format staged files
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,md,mdx}"
      run: pnpm exec ultracite fix {staged_files}
      stage_fixed: true
    - name: format toml
      glob: "*.toml"
      run: taplo fmt {staged_files}
      stage_fixed: true
    - name: lint workflows
      glob: ".github/workflows/*.{yml,yaml}"
      run: jactionlint {staged_files}

pre-push:
  jobs:
    # CI (.github/workflows/ci.yml) と同じ順序・粒度で分割し、失敗したゲートを特定できるようにする
    - name: lint:actions
      glob:
        - ".github/**"
        - "mise.toml"
      run: mise run lint:actions
    - name: lint
      glob:
        - "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}"
        - "tsconfig.json"
        - "biome.jsonc"
        - "package.json"
        - "pnpm-lock.yaml"
      run: mise run lint
    - name: test
      glob:
        - "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}"
        - "vitest.config.ts"
        - "package.json"
        - "pnpm-lock.yaml"
      run: mise run test
    - name: test:storybook
      glob:
        - "src/**/*.{ts,tsx,css}"
        - ".storybook/**"
        - "playwright.config.ts"
        - "vitest.config.ts"
        - "package.json"
        - "pnpm-lock.yaml"
      run: mise run test:storybook
    - name: build
      glob:
        - "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}"
        - "manifest.json"
        - "popup.html"
        - "scripts/**"
        - "package.json"
        - "pnpm-lock.yaml"
      run: mise run build
