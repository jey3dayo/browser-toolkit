allowBuilds:
  "@parcel/watcher": true
  "@swc/core": false
  esbuild: true
  lefthook: true
  ultracite: true
  unrs-resolver: true
minimumReleaseAge: 10080
# pnpm does not enforce the pinned packageManager version; mise reads it from
# package.json's packageManager field and supplies that pnpm version.
# Side effect: pnpm-lock.yaml stays a single YAML document
# (https://github.com/pnpm/pnpm/issues/13805).
pmOnFail: ignore
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
# GitHub Actions は .github/workflows/actions.lock（gh-actions-lock）で固定する。
# pnpm update が uses: を SHA + コメントに戻すと lockfile とぶつかるので無効にする。
update:
  githubActions: false
