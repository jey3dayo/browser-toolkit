allowBuilds:
  "@swc/core": false
  esbuild: true
  lefthook: true
  unrs-resolver: true
minimumReleaseAge: 10080
# Keep pnpm-lock.yaml a single YAML document. pnpm 12 otherwise writes
# packageManagerDependencies as a second document when package.json has
# packageManager (https://github.com/pnpm/pnpm/issues/13805).
pmOnFail: ignore
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
update:
  githubActions: true
