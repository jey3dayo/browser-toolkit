# ========================================
# グローバル設定
# ========================================

[settings]
# pnpm の版は package.json の packageManager が正本（CI の pnpm/action-setup と同じ所を読む）
idiomatic_version_file_enable_tools = ["pnpm"]

[env]
_.file = [".env"]
_.path = ["./node_modules/.bin"]

# ========================================
# ツール
# ========================================

[tools]
node = "26.4.0"
taplo = "0.10.0"
actionlint = "latest"

# ========================================
# コマンド（実処理タスク）
# ========================================

[tasks.format]
description = "Biomeでソース全体を整形（自動修正あり）+ mise.tomlはTaploで整形"
run = ["pnpm run format", "taplo fmt mise.toml"]

[tasks."lint:types"]
description = "TypeScriptの型チェックのみ"
run = "pnpm exec tsc --noEmit"

[tasks."lint:biome"]
description = "Biomeのチェックのみ（自動修正なし）"
run = "pnpm run lint"

[tasks.test]
description = "Vitestでユニットテストを実行"
run = "pnpm run test"

[tasks."test:storybook"]
description = "Storybook(Vitest addon)を実行"
run = "pnpm run test:storybook"

[tasks.build]
description = "拡張機能をビルド"
run = "pnpm run build"

[tasks.clean]
description = "ビルド成果物を削除"
run = "pnpm run clean"

[tasks.lint]
description = "型チェック + Lint"
run = [{ task = "lint:types" }, { task = "lint:biome" }]

# ========================================
# エイリアス（まとめ実行）
# ========================================

[tasks.check]
description = "ローカル確認（lint + test + Storybook）"
run = [{ task = "lint" }, { task = "test" }, { task = "test:storybook" }]

[tasks.ci]
description = "ローカルCI確認"
run = [
  { task = "format" },
  { task = "lint" },
  { task = "test" },
  { task = "test:storybook" },
  { task = "build" },
  "echo '✅ CI checks completed'",
]
